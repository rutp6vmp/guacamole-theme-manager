# TEST ONLY: one private Web upstream, localhost published by the fixture.
# No request/URI logs: Guacamole HTTP and WS may put bearer tokens in queries.
worker_processes 1;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    access_log off;
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        server_tokens off;
        set $web http://web:8080;
        # auth_request is a precondition for every request, including static
        # pages, login POST, REST and tunnel Upgrade. No positive-result cache.
        location / {
            auth_request /_pam_gate_check;
            error_page 500 502 503 504 = @blocked;
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 70s;
            proxy_connect_timeout 2s;
        }
        location = /_pam_gate_check {
            internal;
            proxy_pass $web/guacamole/api/ext/pam-session-probe/ingress-ready;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Guacamole-Token "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
        location @blocked {
            default_type text/plain;
            add_header Cache-Control no-store always;
            return 503 "PAM entry unavailable\n";
        }
    }
}
