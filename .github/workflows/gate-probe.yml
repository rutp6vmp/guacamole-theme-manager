name: Isolated G01 gate probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guacamole-1-6-jdbc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned official API and browser tools
        run: |
          curl --fail --location --retry 3 https://archive.apache.org/dist/guacamole/1.6.0/binary/guacamole-1.6.0.war --output "$RUNNER_TEMP/guacamole-1.6.0.war"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'guacamole-1.6.0.war'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'b41ceb1e2df010b54db563e0b00edb8d5fe9f073c6168462e4c978df0fc6e716'
          PY
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: sh scripts/test.sh
      - name: Build separate test-only probe
        run: python3 scripts/build_pam_probe.py --war "$RUNNER_TEMP/guacamole-1.6.0.war"
      - name: Run only newly generated localhost fixture
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/gate_acceptance.py --probe-jar dist/poc/guacamole-pam-probe-0.1.0.jar
      - name: Build separate session-context probe
        run: python3 scripts/build_pam_probe.py --probe session --war "$RUNNER_TEMP/guacamole-1.6.0.war" --output dist/poc-session
      - name: Recording snapshot validator boundaries
        run: python3 scripts/check_recording_store.py --war "$RUNNER_TEMP/guacamole-1.6.0.war" --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: Real isolated OpenSSH session and local revocation
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: Previously issued sharing credentials and policy failure
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --suite sharing --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: Durable policy, restart, SIGKILL and failed storage
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --suite restart --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: PostgreSQL stall and guacd process loss
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --suite outage --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: Independent entry and bootstrap across theme operations
        run: |
          docker pull nginx:1.28.0-alpine
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --suite ingress --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
      - name: Real SSH recording and scoped browser playback
        run: |
          export GTM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          python3 tests/session_acceptance.py --suite recording --probe-jar dist/poc-session/guacamole-pam-session-probe-0.5.0.jar
