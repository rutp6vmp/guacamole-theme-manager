name: Isolated PAM acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-totp-and-deployment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tests/pam_acceptance.py
