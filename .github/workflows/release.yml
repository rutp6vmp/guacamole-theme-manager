name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh scripts/test.sh
      - name: Match tag to CLI version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(bin/guac-theme --version)"
      - run: cd dist && sha256sum -c SHA256SUMS
      - name: Create draft with installable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag
          --title "GuacTheme Manager ${GITHUB_REF_NAME}"
          --notes-file docs/RELEASE-NOTES.md
          dist/*.jar dist/*.zip dist/SHA256SUMS
